services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5110:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=productos_cqrs;Username=admin;Password=admin123
      - MongoConnection=mongodb://mongo:27017/productos_cqrs_read
      - Sync__IntervalSeconds=60
      - Redis__ConnectionString=redis:6379,password=redis123
      - Api__Nombre=Productos CQRS API (Docker)
      - Api__Mensaje=Desplegado en contenedor
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - backend
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: productos-cqrs-postgres-api
    # Si necesitas acceder desde fuera (debugging), descomenta:
    # ports:
    #   - "5441:5432"
    environment:
      POSTGRES_DB: productos_cqrs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - pgdata_api:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: productos-cqrs-mongo-api
    # Si necesitas acceder desde fuera (debugging), descomenta:
    # ports:
    #   - "27021:27017"
    volumes:
      - mongodata_api:/data/db
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: productos-cqrs-redis-api
    # Si necesitas acceder desde fuera (debugging), descomenta:
    # ports:
    #   - "6391:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_api:/data
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata_api:
  mongodata_api:
  redis_data_api:
