version: '3.8'

services:
  # ── Base de datos: PostgreSQL (Auth + Productos) ───────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: auth_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Base de datos: MongoDB (Proveedores) ───────────────────────────────
  mongo:
    image: mongo:7.0
    ports:
      - "27020:27017"
    networks:
      - backend

  # ── Cache: Redis ───────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    networks:
      - backend

  # ── Microservicio: Auth ────────────────────────────────────────────────
  # Sin 'ports': NO es accesible desde fuera de Docker.
  # Solo el gateway (5100) está publicado; los micros se hablan por la red interna 'backend'.
  auth-microservice:
    build:
      context: .
      dockerfile: AuthMicroService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=auth_db;Username=admin;Password=admin123
      - Jwt__Key=SuperSecretKeyForJwtToken2024!SuperSecretKeyForJwtToken2024!
      - Jwt__Issuer=AuthMicroService
      - Jwt__Audience=ApiGateway
      - Jwt__ExpirationMinutes=60
      - Urls=http://+:5101
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # ── Microservicio: Productos ───────────────────────────────────────────
  # Sin 'ports': interno a la red 'backend'; solo visible vía gateway.
  productos-microservice:
    build:
      context: .
      dockerfile: ProductosMicroService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=productos_db;Username=admin;Password=admin123
      - ConnectionStrings__RedisConnection=redis:6379
      - Cache__DefaultExpirationMinutes=5
      - Urls=http://+:5102
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend

  # ── Microservicio: Proveedores ─────────────────────────────────────────
  # Sin 'ports': interno a la red 'backend'; solo visible vía gateway.
  proveedores-microservice:
    build:
      context: .
      dockerfile: ProveedoresMicroService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__MongoConnection=mongodb://mongo:27017/proveedores_db
      - Urls=http://+:5103
    depends_on:
      - mongo
    networks:
      - backend

  # ── API Gateway (ÚNICO puerto publicado: 5100) ────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-destination__Address=http://auth-microservice:5101
      - ReverseProxy__Clusters__productos-cluster__Destinations__productos-destination__Address=http://productos-microservice:5102
      - ReverseProxy__Clusters__proveedores-cluster__Destinations__proveedores-destination__Address=http://proveedores-microservice:5103
      - Jwt__Key=SuperSecretKeyForJwtToken2024!SuperSecretKeyForJwtToken2024!
      - Jwt__Issuer=AuthMicroService
      - Jwt__Audience=ApiGateway
      - Jwt__ExpirationMinutes=60
      - Urls=http://+:5100
    depends_on:
      - auth-microservice
      - productos-microservice
      - proveedores-microservice
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
