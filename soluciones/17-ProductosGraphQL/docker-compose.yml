name: ud02-17-graphql-dev

services:
  db:
    image: postgres:17-alpine
    container_name: productos_graphql_db_17
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productos_graphql
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: productos_graphql_redis_17
    ports:
      - "6390:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  pgdata:
  redis-data:
