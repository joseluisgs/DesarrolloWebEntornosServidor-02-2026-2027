name: ud02-11-efcore-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=productos;Username=admin;Password=admin123
      - Api__Nombre=Productos EF Core API (Docker)
      - Api__Mensaje=Desplegado en contenedor
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: productos_efcore_db_api_11
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: productos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - pgdata_api:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d productos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_api:
