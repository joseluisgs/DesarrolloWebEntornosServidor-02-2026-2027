name: ud02-11-efcore-dev

services:
  db:
    image: postgres:17-alpine
    container_name: productos_efcore_db_11
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productos
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
