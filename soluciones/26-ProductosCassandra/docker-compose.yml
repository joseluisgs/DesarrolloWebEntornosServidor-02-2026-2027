name: ud02-26-cassandra-dev

services:
  db:
    image: cassandra:5.0
    container_name: productos_cassandra_db_26
    ports:
      - "9042:9042"
    # Sin techo de heap, la JVM pide varios GB y un portátil de clase se ahoga.
    # Con 1G vive cómoda una instancia de desarrollo de un nodo.
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandradata:/var/lib/cassandra

volumes:
  cassandradata:
